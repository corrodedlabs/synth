# The Android app. Separate from ci.yml on purpose: deploy.yml follows the CI workflow alone, so nothing
# here can hold up a production deploy. See android/README.md.
#
# Optional repository secrets:
#   APSIS_DEPLOY_KEY      a read-only deploy key for antash-mishra/apsis, a private submodule. Without it,
#                         only the game core's tests run.
#   SYNTH_KEYSTORE_BASE64, SYNTH_KEYSTORE_PASSWORD, SYNTH_KEY_ALIAS, SYNTH_KEY_PASSWORD
#                         sign the release bundle.
name: Android

on:
  pull_request:
    paths:
      - "android/**"
      - "native/**"
      - "apsis"
      - "app/test-data/**"
      - ".github/workflows/android.yml"
  push:
    branches: [master]
    paths:
      - "android/**"
      - "native/**"
      - "apsis"
      - "app/test-data/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      version_code:
        description: Play version code, higher than the last upload
        required: true

permissions:
  contents: read

jobs:
  core:
    name: Game core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # settings.gradle.kts includes :app, which needs the Android SDK to configure; GitHub's runners have it.
      - name: Core tests
        working-directory: android
        run: ./gradlew :core:test

  app:
    name: Table and APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_APSIS: ${{ secrets.APSIS_DEPLOY_KEY != '' }}
    steps:
      - name: Skip without access to Apsis
        if: env.HAS_APSIS != 'true'
        run: echo "::notice::APSIS_DEPLOY_KEY isn't set, so the table and APK aren't built."
      - uses: actions/checkout@v4
        if: env.HAS_APSIS == 'true'
        with:
          submodules: true
          ssh-key: ${{ secrets.APSIS_DEPLOY_KEY }}
      - uses: actions/setup-java@v4
        if: env.HAS_APSIS == 'true'
        with:
          distribution: temurin
          java-version: 21
      - name: Install the NDK, CMake and SDL's Linux headers
        if: env.HAS_APSIS == 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev libegl1-mesa-dev \
            libgl1-mesa-dev libdbus-1-dev libudev-dev
      - name: Table tests
        if: env.HAS_APSIS == 'true'
        run: |
          cmake -S native -B build/native -G Ninja
          cmake --build build/native --target table_test
          ctest --test-dir build/native --output-on-failure
      - name: Debug APK
        if: env.HAS_APSIS == 'true'
        working-directory: android
        run: ./gradlew :app:assembleDebug
      - name: Signed release bundle
        if: env.HAS_APSIS == 'true' && github.event_name == 'workflow_dispatch'
        working-directory: android
        env:
          SYNTH_VERSION_CODE: ${{ inputs.version_code }}
          SYNTH_KEYSTORE_PASSWORD: ${{ secrets.SYNTH_KEYSTORE_PASSWORD }}
          SYNTH_KEY_ALIAS: ${{ secrets.SYNTH_KEY_ALIAS }}
          SYNTH_KEY_PASSWORD: ${{ secrets.SYNTH_KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.SYNTH_KEYSTORE_BASE64 }}
        run: |
          umask 077
          : "${KEYSTORE_BASE64:?Set SYNTH_KEYSTORE_BASE64 before requesting a release}"
          : "${SYNTH_KEYSTORE_PASSWORD:?Set SYNTH_KEYSTORE_PASSWORD before requesting a release}"
          : "${SYNTH_KEY_ALIAS:?Set SYNTH_KEY_ALIAS before requesting a release}"
          : "${SYNTH_KEY_PASSWORD:?Set SYNTH_KEY_PASSWORD before requesting a release}"
          export SYNTH_KEYSTORE="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$SYNTH_KEYSTORE"' EXIT
          echo "$KEYSTORE_BASE64" | base64 -d > "$SYNTH_KEYSTORE"
          ./gradlew :app:bundleRelease
      - uses: actions/upload-artifact@v4
        if: env.HAS_APSIS == 'true' && github.event_name == 'workflow_dispatch'
        with:
          name: synth-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab

  # A release build run by hand from master also becomes a GitHub pre-release, tagged
  # android-v<versionName>-<versionCode>, with the bundle and its checksum. Builds from other branches
  # stay as artifacts only.
  release:
    name: GitHub release
    needs: [core, app]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: synth-release-bundle
          path: bundle
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ inputs.version_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          version_name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          short=$(git rev-parse --short=7 HEAD)
          tag="android-v${version_name}-${VERSION_CODE}"
          file="twenty-eight-${VERSION_CODE}-${short}.aab"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "::error::$tag already exists. Use a higher version code."
            exit 1
          fi
          mv bundle/*.aab "bundle/$file"
          (cd bundle && sha256sum "$file" > "$file.sha256")
          previous=$(git tag --list 'android-v*' --sort=-creatordate | head -n 1)
          {
            echo "Version ${version_name} (version code ${VERSION_CODE}) of **28** for Android, \`com.respawnfi.twentyeight\`."
            echo
            echo "Built from \`master\` at ${short} by [this run](${RUN_URL}), and signed with the upload key."
            echo "Upload \`${file}\` to Play Console; the bundle can't be installed directly."
            echo
            if [ -n "$previous" ]; then
              echo "### Changes since ${previous}"
              echo
              git log --no-merges --format='- %s (%h)' "${previous}..HEAD"
            fi
          } > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
            --title "28 for Android ${version_name} (build ${VERSION_CODE})" \
            --notes-file notes.md "bundle/$file" "bundle/$file.sha256"
